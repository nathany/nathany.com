{{ partial "header.html" . }}

<article class="page {{ if eq .Title " Identity" }}identity-page{{ end }}">
  <section class="title">
    <h1>{{ .Title }}</h1>
    <div class="meta">
      {{ if .Description }}
      <p>{{ .Description | markdownify }}</p>
      {{ end }}
    </div>
  </section>

  {{ if eq .Title "Identity" }}
  <div class="identity-layout">
    <aside class="identity-bio">
      {{ partial "bio.html" . }}
    </aside>
    <section class="identity-content">
      {{ .Content }}
    </section>
  </div>
  {{ else }}
  <section class="content">
    {{ .Content }}
  </section>
  {{ end }}
</article>

{{ partial "footer.html" . }}
