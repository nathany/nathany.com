---
layout: default
---

<article>
  <section class="title">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      {% if page.revised %}
        First published on {{ page.date | date_to_string }}, last revised {{ page.revised | date_to_string }}.
      {% else %}
        Published on {{ page.date | date_to_string }}
      {% endif %}
    </p>
  </section>
  <section class="content">
    {{ content }}
  </section>
</article>
