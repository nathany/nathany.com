---
layout: default
title: Articles
permalink: /articles/
---

<a href="{{ site.url }}/articles.xml" title="Atom feed" class="ss-icon ss-rss"></a>

<div id="home">
  <h1>Articles</h1>
  <ul class="posts">
    {% for post in site.posts %}
      <li>
        <span>{{ post.date | date_to_string }}</span> &raquo; <a href="{{ post.url }}">{{ post.title }}</a>
        <p>{{ post.excerpt | markdownify }}</p>
      </li>
    {% endfor %}
  </ul>
</div>
