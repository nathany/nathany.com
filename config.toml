baseURL = "https://nathany.com"
languageCode = "en-us"
title = "Nathan Youngman"
copyright = "2024 Nathan Youngman"

pygmentsCodeFences = true
pygmentsUseClasses = true

[outputFormats.RSS]
baseName = "articles"

[author]
name = "Nathan Youngman"

[permalinks]
post = "/:filename/"
about = "/:filename/"

[deployment]
order = [".png$", ".jpg$", ".gif$", ".svg$"]

[[deployment.targets]]
URL = "s3://nathany.com?region=ca-central-1"

[[deployment.matchers]]
# Cache static assets for 20 years.
pattern = "^.+\\.(js|css|png|jpg|gif|svg|ttf)$"
cacheControl = "max-age=630720000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(html|xml|json)$"
gzip = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
