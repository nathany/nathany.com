baseURL = "https://nathany.com"
languageCode = "en-us"
title = "Nathan Youngman"
copyright = "2025 Nathan Youngman"

pygmentsCodeFences = true
pygmentsUseClasses = true
disableKinds = ["taxonomy", "section"]

[outputFormats.RSS]
baseName = "articles"

[params]
copyright-year = '2025'
home_title = "Nathan's Articles"
[params.author]
name = "Nathan Youngman"
email = "git@nathany.com"

[author]
name = "Nathan Youngman"

[permalinks]
post = "/:contentbasename/"
about = "/:contentbasename/"

[deployment]
order = [".png$", ".jpg$", ".gif$", ".svg$"]

[[deployment.targets]]
URL = "s3://nathany.com?region=ca-central-1"

[[deployment.matchers]]
# Cache static assets for 20 years.
pattern = "^.+\\.(js|css|png|jpg|gif|svg|ttf)$"
cacheControl = "max-age=630720000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(html|xml|json)$"
gzip = true

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
